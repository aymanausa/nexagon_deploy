# Needed for WebSocket/HMR upgrade proxying (map runs in http{} context).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name nexagon.nexamind.com.sa;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    client_max_body_size 20m;

    # Everything -> Next.js frontend. Browser calls /api same-origin; Next
    # rewrites /api to the backend internally (BACKEND_URL in compose).
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name nexagon.nexamind.com.sa;
    return 301 https://$host$request_uri;
}
