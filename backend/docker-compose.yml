version: "3.9"

services:
  api:
    build: .
    container_name: ews-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=ews-dev-secret-key-change-in-production
      - DATABASE_URL=postgresql://ews_user:ews_pass@postgres:5432/ews_db
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=http://localhost:3001,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev

  postgres:
    image: postgres:16-alpine
    container_name: ews-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ews_user
      - POSTGRES_PASSWORD=ews_pass
      - POSTGRES_DB=ews_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ews_user -d ews_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ews-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
